services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      MAIA_DB: /data/maia.db
    volumes: ["maia_data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  maia_data:
